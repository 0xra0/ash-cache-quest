# Cynosure M1 greybox (docs/cynosure_import/CYNOSURE_IMPLEMENTATION.md, "M1 — Greybox Vertical Slice").
# Frame CYN: origin 300 m under the motel lot, +Y is the canonical route forward.
# Main rooms sit on x=0 end to end along +Y; side rooms hang off east/west walls.
# Every door offset is 0 because each connected pair shares a centre line.
# Room sizes follow the concept images (sc_cynosure_desing_locations_1..8).
edl: 1
id: cynosure_m1
name: Cynosure M1 Greybox
origin:
  position: [-1908, -2470, -300]
  yaw: 0
materials:
  room_kit: bunker_large   # 12x8 m floor tiles, 8 m wall spans (see LS room_kits.lua)
streaming:
  category: interior
  level: 1
  cell: [64, 64, 32]
  range: 400
templates:
  work_light:        # amber strip light, images 2/3/5
    color: [1.0, 0.72, 0.35]
    intensity: 80
    radius: 12
  cold_light:        # blue-white facility light, images 4/8
    color: [0.7, 0.85, 1.0]
    intensity: 90
    radius: 14
  core_light:        # purple core glow, images 1/6/7
    color: [0.7, 0.35, 1.0]
    intensity: 220
    radius: 30
